services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gen12-mysql-pos
      MYSQL_USER: tech0
      MYSQL_PASSWORD: tech0devpass
      MYSQL_ROOT_PASSWORD: rootdevpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./pos-app/backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./pos-app/backend
    environment:
      APP_ENV: development
      SECRET_KEY: local-development-only-change-this-secret-key
      ACCESS_TOKEN_EXPIRE_HOURS: 8
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: gen12-mysql-pos
      DB_USER: tech0
      DB_PASSWORD: tech0devpass
      CORS_ALLOW_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./pos-app/frontend
      args:
        INTERNAL_API_BASE_URL: http://backend:8000
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
